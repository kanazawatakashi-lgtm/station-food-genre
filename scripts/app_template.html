<title>飲食出店ナビ・東京23区版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* 左に地図、右に分析パネル（タブ: 各駅情報・地点分析・比較・ジャンル別・乗降客数）。狭い画面では縦に積む */
:root {
  --bg: #eef1ef; --panel: #ffffff; --land: #fbfcfb; --ward-line: #c9d1cd; --rule: #d8dfdc;
  --ink: #1d2523; --ink-2: #4d5a56; --ink-3: #7c8985;

  --jr: #4f8a2e; --private: #c0457a; --subway: #2f5fb3; --on-line: #ffffff;
  --g0: #c2462e; --g1: #7d4fb5; --g2: #b07a12; --g3: #2a7fb8; --g4: #2f8a5f; --g5: #a7b0ad;
  --lo: #2a7fb8; --mid: #c3cac7; --hi: #c2462e;
  --a0: #d6ebe8; --a1: #a6d2cb; --a2: #75b3aa; --a3: #4b928a; --a4: #2e706a; --a5: #1a4c48; --a6: #d6dbd9;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111716; --panel: #171e1d; --land: #1a2120; --ward-line: #34403d; --rule: #2a3331;
    --ink: #e6ecea; --ink-2: #aab6b2; --ink-3: #7d8a86; --accent: #d9e2df; --accent-soft: rgba(217, 226, 223, 0.14); --pick: #f08a4b;
    --jr: #5f9e3f; --private: #d16a96; --subway: #5a88dc; --on-line: #111716;
    --g0: #d9604a; --g1: #9d78d4; --g2: #b38020; --g3: #4e94d0; --g4: #3f9a6e; --g5: #5d6966;
    --lo: #4e94d0; --mid: #46524f; --hi: #d9604a;
    --a0: #1b4440; --a1: #24625c; --a2: #33837b; --a3: #52a69c; --a4: #80c8bf; --a5: #b5e3dc; --a6: #3a4441;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111716; --panel: #171e1d; --land: #1a2120; --ward-line: #34403d; --rule: #2a3331;
  --ink: #e6ecea; --ink-2: #aab6b2; --ink-3: #7d8a86; --accent: #d9e2df; --accent-soft: rgba(217, 226, 223, 0.14); --pick: #f08a4b;
  --jr: #5f9e3f; --private: #d16a96; --subway: #5a88dc; --on-line: #111716;
  --g0: #d9604a; --g1: #9d78d4; --g2: #b38020; --g3: #4e94d0; --g4: #3f9a6e; --g5: #5d6966;
  --lo: #4e94d0; --mid: #46524f; --hi: #d9604a;
  --a0: #1b4440; --a1: #24625c; --a2: #33837b; --a3: #52a69c; --a4: #80c8bf; --a5: #b5e3dc; --a6: #3a4441;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; margin: 0; }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(22px, 2.6vw, 28px); margin: 0; letter-spacing: 0.02em; }
.num { font-variant-numeric: tabular-nums; }
.app { overflow: clip; min-width: 0; }
.wrap > * { min-width: 0; }
.main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); align-items: start; }
.main.nomap { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; }

/* 地図 */
.mapbox { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); overflow: hidden; border-right: 1px solid var(--rule); }
@media (max-width: 900px) { .mapbox { position: relative; top: 0; border-right: 0; border-bottom: 1px solid var(--rule); } }
.tools { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; z-index: 2; }
.tools > * { pointer-events: auto; }
.layers { display: flex; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.layers label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.sw { display: inline-block; width: 16px; height: 0; border-top: 3px solid; }
.sw.jr { border-color: var(--jr); } .sw.private { border-color: var(--private); } .sw.subway { border-color: var(--subway); border-top-style: dashed; }
.zoom { margin-left: auto; display: flex; gap: 6px; }
.btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; min-height: 34px; padding: 0 12px; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.btn:focus-visible, .tab:focus-visible, .row:focus-visible, .chip:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
svg.map { display: block; width: 100%; height: min(82vh, 860px); min-height: 380px; touch-action: none; cursor: grab; background: var(--panel); }
@media (max-width: 900px) { svg.map { height: 62vh; } }
svg.map.drag { cursor: grabbing; } svg.map.pointmode { cursor: crosshair; }
.ward { fill: var(--land); stroke: var(--ward-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ward-name { fill: var(--ink-3); font-family: var(--font-body); text-anchor: middle; pointer-events: none; }
.rl { fill: none; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-width: 1.5; stroke-opacity: 0.8; pointer-events: none; }
.rl.jr { stroke: var(--jr); } .rl.private { stroke: var(--private); } .rl.subway { stroke: var(--subway); stroke-dasharray: 4 2; }
.muted .rl { stroke: var(--ink-3); stroke-opacity: 0.35; }
.st { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; vector-effect: non-scaling-stroke; }
.zoomed .st { fill: none; stroke-opacity: 0.5; }
.st.sel { fill: var(--pick); fill-opacity: 0.5; stroke: var(--pick); stroke-width: 2; }
.st.cmp { stroke: var(--pick); stroke-width: 2; }
.lbl { fill: var(--ink); font-family: var(--font-body); font-weight: 700; paint-order: stroke; stroke: var(--land); stroke-linejoin: round; pointer-events: none; text-anchor: middle; }
.ring { fill: var(--pick); fill-opacity: 0.06; stroke: var(--pick); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-dasharray: 6 3; pointer-events: none; }
.dot { stroke: var(--panel); stroke-width: 1; vector-effect: non-scaling-stroke; }
.dot.hot { stroke: var(--ink); stroke-width: 2.5; }
.pin { fill: var(--pick); stroke: var(--panel); stroke-width: 2; vector-effect: non-scaling-stroke; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; border-top: 1px solid var(--rule); padding-block: 8px; padding-inline: 12px; font-size: 13px; color: var(--ink-2); }
.key { display: inline-flex; align-items: center; gap: 5px; }
.key i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.ramp { width: 120px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--lo), var(--mid), var(--hi)); display: inline-block; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.14); font-size: 14px; max-width: 280px; }
.tip b { font-family: var(--font-display); font-size: 16px; }
.tip .s { color: var(--ink-2); font-size: 13px; }
.rowtip { position: fixed; z-index: 25; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.14); font-size: 14px; max-width: min(360px, calc(100vw - 32px)); line-height: 1.5; }
.rowtip b { font-size: 15px; } .rowtip .s { color: var(--ink-2); font-size: 13px; }

/* パネル */
.panel { display: grid; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tab { font: inherit; font-weight: 700; font-size: 15px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--ink-2); padding: 12px 14px 9px; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pick); }
@media (max-width: 520px) { .tab { font-size: 13.5px; padding: 11px 6px 8px; letter-spacing: -0.02em; } }
.pane { padding-block: 18px 24px; padding-inline: 18px; display: grid; gap: 22px; min-width: 0; }
/* 地点分析の結果のまとまり。まとまりの間をあける */
#ptBody { display: grid; gap: 22px; }
.block { display: grid; gap: 10px; }
.block > h3 { margin: 0; }
h2 + .muted-t { margin-top: 4px; }
/* 中の要素が広い表に合わせて広がらないようにする（表は .tablewrap の中で横スクロールさせる） */
.pane > * { min-width: 0; }
.search { display: flex; gap: 8px; flex-wrap: wrap; }
.search input, .search select, select.inp, input.inp { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; min-height: 36px; min-width: 0; }
.search input { flex: 1 1 12em; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0; line-height: 1.3; }
h3 { font-size: 15px; margin: 0 0 8px; color: var(--ink-2); font-weight: 700; }
.listhead h3, .lgrp h3 { margin: 0; }
.muted-t { color: var(--ink-3); font-size: 13px; margin: 0; }
/* 各タブの一番上の「このページでできること」 */
.lead { margin: 0; font-size: 15px; color: var(--ink); font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; border: 0; background: var(--panel); color: var(--ink-2); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; }
.stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .l { color: var(--ink-3); font-size: 12px; }
.bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--panel); }
.bar span { display: block; height: 100%; min-width: 2px; }
.barrow { display: grid; grid-template-columns: 5.5em 1fr; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.keys { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; margin-top: 8px; }
.barrow + .barrow { margin-top: 4px; }
.lq { display: grid; gap: 4px; }
.lqrow { display: grid; grid-template-columns: minmax(6em, 1fr) 6em 3.5em; gap: 8px; font-size: 14px; align-items: center; padding: 2px 0; border-bottom: 1px solid var(--rule); }
.lqrow .v { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.lqrow .c { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
.todo { border: 1px dashed var(--rule); border-radius: 6px; padding: 10px 12px; color: var(--ink-2); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; width: 100%; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); }
thead th { color: var(--ink-2); font-weight: 700; font-size: 13px; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: 2em minmax(5em, 1fr) 5em 3.5em 6em; gap: 8px; align-items: center; padding: 5px 4px; border-bottom: 1px solid var(--rule); cursor: pointer; font-size: 14px; }
.row:hover { background: var(--bg); }
.row .r { color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.row .n { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .v { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.row.head { cursor: default; color: var(--ink-3); font-size: 12px; } .row.head:hover { background: none; }
.list { max-height: 460px; overflow-y: auto; border-top: 1px solid var(--rule); }
/* 店名の欄は以前（ジャンル欄 9em の残り全部）より 20% 狭くし、その分をジャンルの欄に回す */
.srow { display: grid; grid-template-columns: 10px max(4em, calc((100% - 12.5em - 34px) * 0.8)) minmax(0, 1fr) 3.5em; cursor: default; gap: 8px; align-items: center; padding: 5px 2px; border-bottom: 1px solid var(--rule); font-size: 14px; }
.srow i { width: 10px; height: 10px; border-radius: 50%; }
.srow .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .g { color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow:hover { background: var(--bg); }
.srow .d { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.chip b { margin-left: 4px; color: var(--ink-3); }
/* 選ばれている絞り込み（近隣店の一覧のジャンル）は、背景を濃くして見分ける */
.chip[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); font-weight: 700; }
.chip[aria-pressed="true"] i { box-shadow: 0 0 0 1.5px var(--panel); }
.help { font: inherit; font-size: 11px; font-weight: 700; width: 18px; height: 18px; line-height: 16px; padding: 0; margin-left: 4px; border-radius: 50%; border: 1px solid var(--ink-3); background: var(--panel); color: var(--ink-2); cursor: pointer; vertical-align: 1px; }
.help:hover, .help[aria-expanded="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pop { position: fixed; z-index: 20; max-width: min(340px, calc(100vw - 32px)); background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding-block: 12px; padding-inline: 14px; font-size: 14px; line-height: 1.7; text-align: left; white-space: normal; font-weight: 400; }
.pop h4 { margin: 0 0 4px; font-size: 14px; }
.pop p { margin: 0 0 8px; }
.pop ul { margin: 4px 0 0; padding-left: 1.2em; }
.pop ul.plain { list-style: none; padding-left: 0; }
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); display: grid; place-items: start center; overflow-y: auto; padding-block: 24px; padding-inline: 16px; }
.sheet { background: var(--panel); color: var(--ink); border-radius: 10px; width: min(860px, 100%); padding-block: 18px 24px; padding-inline: 20px; display: grid; gap: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.sheet-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
table.gt td, table.gt th { white-space: nowrap; }
table.gt tr.maj td { font-weight: 700; background: var(--bg); }
table.gt tr.mid td:first-child { padding-left: 1.6em; }
table.gt tr.unk td { color: var(--ink-3); }
/* 狭い画面では、左に固定したジャンル名の列を折り返して、数字の列を広く見せる */
@media (max-width: 520px) { table.gt th:first-child, table.gt td:first-child { white-space: normal; min-width: 7.5em; max-width: 9em; } }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.pin-input { display: grid; gap: 8px; }
.listhead { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.listbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.copybox { width: 100%; min-height: 50vh; font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; }
.mgrps { display: grid; gap: 2px; }
.mgrp { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.mgrp .mh { font-weight: 700; white-space: nowrap; }
.mgrp .mh i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.mgrp .mi b, .mgrp .mh b { font-weight: 700; }
.mgrp .mi { color: var(--ink-2); line-height: 1.7; }
@media (max-width: 520px) { .mgrp { grid-template-columns: 1fr; gap: 2px; } }
.radios { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.radios label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 15px; }
.radios input { width: 16px; height: 16px; accent-color: var(--pick); }
.prow { display: grid; grid-template-columns: 2.4em minmax(5em, 9em) 1fr 7em; gap: 10px; align-items: center; padding: 4px; border-bottom: 1px solid var(--rule); cursor: pointer; font-size: 14px; }
.prow:hover { background: var(--bg); }
.prow .r { color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.prow .n { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pb { height: 10px; background: var(--ink-2); border-radius: 0 4px 4px 0; min-width: 2px; }
.prow .v { text-align: right; font-variant-numeric: tabular-nums; }
.lchip { font: inherit; font-size: 13px; font-weight: 700; border: 0; border-radius: 999px; padding: 4px 11px; cursor: pointer; color: var(--on-line); }
.lchip.jr { background: var(--jr); } .lchip.private { background: var(--private); } .lchip.subway { background: var(--subway); }
.lchip[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.lines.dim .lchip[aria-pressed="false"] { opacity: 0.45; }
.lgrp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lgrp > span { font-weight: 700; min-width: 4em; font-size: 14px; }
#gR.dim .rl:not(.sel) { stroke-opacity: 0.12; }
.rl.sel { stroke-width: 4; stroke-opacity: 1; stroke-dasharray: none; }
.rail-lbl { pointer-events: none; }
.rail-lbl rect { stroke: var(--land); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.rail-lbl.jr rect { fill: var(--jr); } .rail-lbl.private rect { fill: var(--private); } .rail-lbl.subway rect { fill: var(--subway); }
.rail-lbl text { fill: var(--on-line); font-family: var(--font-body); font-weight: 700; dominant-baseline: central; text-anchor: middle; }
.summary { border-left: 4px solid var(--pick); background: var(--bg); border-radius: 0 6px 6px 0; padding-block: 10px; padding-inline: 14px; display: grid; gap: 4px; }
.summary p { margin: 0; font-size: 15px; line-height: 1.75; }
.summary .tag { font-size: 12px; color: var(--ink-3); font-weight: 700; letter-spacing: 0.04em; }
.note { color: var(--ink-3); font-size: 12px; line-height: 1.7; margin: 0; }
.note a { color: var(--ink-2); margin-right: 6px; }
.foot { padding-block: 14px; padding-inline: 16px; display: grid; gap: 6px; }
</style>

<div class="wrap">
  <header>
    <h1>飲食出店ナビ・東京23区版</h1>
  </header>

  <div class="card app">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-point" aria-selected="true" aria-controls="p-point">地点分析</button>
      <button class="tab" role="tab" id="t-station" aria-selected="false" aria-controls="p-station">各駅分析</button>
      <button class="tab" role="tab" id="t-compare" aria-selected="false" aria-controls="p-compare">駅比較</button>
      <button class="tab" role="tab" id="t-genre" aria-selected="false" aria-controls="p-genre">ジャンル別</button>

<script>
const D = __DATA__;
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("ja-JP");
const pct = v => (v * 100).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ST = D.stations, SS = D.stores, M = D.majors, MID = D.mids;
const UNKNOWN_M = M.length - 1;
const GCOL = M.map((_, i) => `var(--g${i})`);
const svg = $("map"), box = $("mapbox"), tip = $("tip");
// 初期表示の駅は駅名で指す（乗降客数データの版が変わると駅の番号が変わることがあるため）。同名の駅は乗降客数の多い方
// 「○○駅」の形の呼び方。路線名を添えた駅は「浅草駅（つくばエクスプレス）」のように、かっこの前に「駅」を入れる
const ekiName = s => s.n.includes("（") ? s.n.replace("（", "駅（") : `${s.n}駅`;
// 平均比（LQ_w）＝ 補正後の中分類の割合 ÷ 23区の補正後の割合。店が0軒の中分類は 0倍（範囲に飲食店が無ければ出さない）
function withLQ(r) { const kw = r.w.reduce((a, b) => a + b, 0); r.q = r.w.map((w, i) => kw > 0 && D.base.m[i] ? (w / kw) / D.base.m[i] : null); return r; }
ST.forEach(s => D.radii.forEach(R => withLQ(s.r[String(R)])));
// 各駅分析の範囲（ドーナツ型）。複数選ぶと合わせた範囲になる（0〜250m と 250〜500m で 0〜500m）
const RINGS = [[0, 250], [250, 500], [500, 1000]];
function ringLabel(sel) {
  const spans = [];
  RINGS.forEach(([a, b], k) => { if (!sel[k]) return; const last = spans[spans.length - 1]; if (last && last[1] === a) last[1] = b; else spans.push([a, b]); });
  return spans.map(([a, b]) => `${a}〜${b}m`).join("・");
}
function ringStats(s, sel = state.rings) {
  const Z = () => ({ t: 0, tw: 0, M: M.map(() => 0), m: MID.map(() => 0), w: MID.map(() => 0), u: 0, e: 0 });
  const acc = Z(); let pop = null, km2 = 0;
  RINGS.forEach(([a, b], k) => {
    if (!sel[k]) return;
    const o = s.r[String(b)], i = a ? s.r[String(a)] : Z();
    acc.t += o.t - i.t; acc.tw += o.tw - i.tw; acc.u += o.u - i.u; acc.e = acc.e || o.e;
    o.M.forEach((v, j) => acc.M[j] += v - i.M[j]); o.m.forEach((v, j) => acc.m[j] += v - i.m[j]); o.w.forEach((v, j) => acc.w[j] += v - i.w[j]);
    const po = s.pop[String(b)], pi = a ? s.pop[String(a)] : null;
    if (po) { pop = pop || po.map(() => 0); po.forEach((v, j) => pop[j] += v - (pi ? pi[j] : 0)); }
    km2 += Math.PI * (b * b - a * a) / 1e6;
  });
  acc.w = acc.w.map(v => Math.max(0, v)); acc.tw = Math.max(0, acc.tw);  // 小数の引き算の誤差
  return Object.assign(withLQ(acc), { pop, km2, label: ringLabel(sel) });
}
const stByName = n => { const i = ST.findIndex(s => s.n === n); return i < 0 ? null : i; };

// 座標 → 地図座標（Python 側の xy と同じ式）
const P = D.proj;
const toXY = (la, lo) => [(lo - P.lng0) * P.kx * P.s, (P.lat0 - la) * P.s];
const fromXY = (x, y) => [P.lat0 - y / P.s, x / (P.kx * P.s) + P.lng0];
const mPerUnit = 111320 / P.s; // 地図座標1あたりのメートル（おおよそ）
function distM(la1, lo1, la2, lo2) {
  const r = Math.PI / 180, a = Math.sin((la2 - la1) * r / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin((lo2 - lo1) * r / 2) ** 2;
  return 12742000 * Math.asin(Math.sqrt(a));
}

// ---- 平均比の説明（? マーク）----
const HELP = {
  lq: ["平均比の説明", `<h4>平均比とは</h4><p>その駅のまわり（選んだ半径の範囲）にある飲食店のうち、あるジャンルが占める割合が、23区全体の割合の何倍かを表した数字です。</p><h4>例</h4><p>仮に、23区全体では飲食店の10%が居酒屋だとします。A駅のまわりでは飲食店の20%が居酒屋だとすると、A駅の居酒屋の平均比は 20% ÷ 10% ＝ <b>2.0倍</b> です。</p><ul><li>1.0倍：23区平均と同じ</li><li>2.0倍：23区平均の2倍ある（多い）</li><li>0.5倍：23区平均の半分しかない（少ない）</li></ul>`],
  dayNight: ["働く人 ÷ 住む人の説明", `<p>「働く人 ÷ 住む人」が大きいほど、昼間に人が集まる街（ランチ需要が大きい）です。</p>`],
  work: ["従業者数の説明", `<p>従業者数は事業所で働く人の数で、通学者や買い物客は含みません。</p>`],
  few: ["少ないジャンルの見方", `<p>平均比が低いジャンルは、出店の好機とは限りません。需要そのものが少ない場合もあります。商圏の人や競合と合わせて判断してください。</p>`],
  majorShare: ["構成比の分母の説明", `<h4>構成比の分母</h4><p>大分類（和食・洋食など）の構成比は、大分類まで分かった店だけを分母にして計算しています。大分類も分からない店は除いています。</p><h4>大分類</h4><ul class="plain">${M.slice(0, UNKNOWN_M).map((m, i) => `<li><span class="swatch" style="background:${GCOL[i]}"></span>${esc(m)}</li>`).join("")}</ul>`],
  office: ["オフィス・商業系の説明", `<p>オフィス・商業系は、情報通信・卸売小売・金融保険・不動産・専門サービス・その他サービス（警備・ビル管理・派遣など）の合計です。</p>`],
};
const help = (k = "lq") => `<button class="help" type="button" aria-label="${HELP[k][0]}" aria-expanded="false" data-help="${k}">?</button>`;
const pop = $("pop");
let popBtn = null;
function closePop() { pop.hidden = true; if (popBtn) popBtn.setAttribute("aria-expanded", "false"); popBtn = null; }
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-help]");
  if (b) {
    e.stopPropagation();
    if (popBtn === b) { closePop(); return; }
    closePop(); popBtn = b; b.setAttribute("aria-expanded", "true");
    const [label, body] = HELP[b.dataset.help] || HELP.lq;
    pop.setAttribute("aria-label", label); pop.innerHTML = body; pop.hidden = false;
    const r = b.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    let x = Math.min(window.innerWidth - w - 16, Math.max(16, r.left - w / 2));
    let y = r.bottom + 8; if (y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 8);
    pop.style.left = x + "px"; pop.style.top = y + "px";
    return;
  }
  if (!pop.hidden && !pop.contains(e.target)) closePop();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
window.addEventListener("scroll", closePop, { passive: true });

// ---- ジャンル別構成表 ----
function genreTable(r) {
  const knownM = r.M.reduce((a, v, i) => a + (i === UNKNOWN_M ? 0 : v), 0) || 1;
  const knownm = r.m.reduce((a, b) => a + b, 0) || 1;
  let rows = "";
  M.slice(0, UNKNOWN_M).forEach((m, j) => {
    rows += `<tr class="maj"><td><span class="swatch" style="background:${GCOL[j]}"></span>${esc(m)}</td><td>${fmt(r.M[j])}</td><td>${pct(r.M[j] / knownM)}</td><td>${pct(D.base.rawM[j])}</td><td></td></tr>`;
    MID.forEach((x, i) => {
      if (D.midMajor[i] !== j) return;
      const q = r.q[i];
      rows += `<tr class="mid"><td>${esc(x)}</td><td>${fmt(r.m[i])}</td><td>${pct(r.m[i] / knownm)}</td><td>${pct(D.base.rawm[i])}</td><td>${q == null ? "—" : q.toFixed(2) + "倍"}</td></tr>`;
    });
  });
  rows += `<tr class="unk"><td>大分類も分からない店</td><td>${fmt(r.M[UNKNOWN_M])}</td><td></td><td></td><td></td></tr>`;
  rows += `<tr class="unk"><td>中分類まで分からない店（上の大分類も分からない店を含む）</td><td>${fmt(r.u)}</td><td></td><td></td><td></td></tr>`;
  return `<div class="tablewrap"><table class="gt"><thead><tr><th>ジャンル</th><th>店数</th><th>構成比</th><th>23区の構成比</th><th>平均比${help()}</th></tr></thead><tbody>
    <tr class="maj"><td>飲食店 合計</td><td>${fmt(r.t)}</td><td></td><td></td><td></td></tr>${rows}</tbody></table></div>
    <p class="muted-t">構成比の分母は、大分類なら大分類が分かる店、中分類なら中分類が分かる店。平均比は国の統計（経済センサス）で地図サービスの偏りを補正した値のため、構成比どうしの比とは少し違います。</p>`;
}
function openModal(title, bodyHtml) {
  $("mTitle").textContent = title; $("mBody").innerHTML = bodyHtml; $("modal").hidden = false; $("mClose").focus();
}
$("mClose").onclick = () => { $("modal").hidden = true; };
$("modal").addEventListener("click", e => { if (e.target === $("modal")) $("modal").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("modal").hidden && pop.hidden) $("modal").hidden = true; });

// ---- 地図の描画 ----
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const gW = $("gW"), gWN = $("gWN"), gR = $("gR"), gC = $("gC"), gP = $("gP"), gL = $("gL");
D.wards.forEach(w => { el("path", { d: w.d, class: "ward" }, gW); el("text", { x: w.c[0], y: w.c[1], class: "ward-name" }, gWN).textContent = w.name; });
const railEls = D.rails.map(r => el("path", { d: r.d, class: `rl ${r.k}` }, gR));
[["lyJr", "jr"], ["lyPrivate", "private"], ["lySub", "subway"]].forEach(([id, k]) => {
  const sync = () => railEls.forEach((p, i) => { if (D.rails[i].k === k) p.style.display = $(id).checked ? "" : "none"; });
  $(id).addEventListener("change", sync); sync();
});
const maxP = ST[0].p;
const R = p => Math.max(1.6, 26 * Math.sqrt(p / maxP));
// 円の大きさ: 乗降客数タブでは乗降客数に合わせる。ほかのタブでは全駅同じ大きさ（画面上で一定。選んだ駅は少し大きく）
const stR = (i, px) => state.tab === "pass" ? R(ST[i].p) : ((state.tab === "station" && i === state.sel) || (state.tab === "compare" && state.cmp.includes(i)) ? 7 : 4.5) * px;
const circles = ST.map((s, i) => el("circle", { cx: s.x, cy: s.y, r: R(s.p), class: "st" }, gC));
const labels = ST.map(s => { const t = el("text", { x: s.x, y: s.y, class: "lbl" }, gL); t.textContent = s.n; return t; });

const full = { x: 0, y: 0, w: D.w, h: D.h };
let vb = { ...full };
const unitPx = () => { const m = svg.getScreenCTM(); return m && m.a ? 1 / m.a : vb.w / Math.max(svg.clientWidth, 1); };
function toMap(cx, cy) { const m = svg.getScreenCTM(); if (!m) return { x: 0, y: 0 }; const p = new DOMPoint(cx, cy).matrixTransform(m.inverse()); return { x: p.x, y: p.y }; }
function clampVb() {
  vb.w = Math.min(Math.max(vb.w, full.w / 220), full.w); vb.h = vb.w * full.h / full.w;
  vb.x = Math.min(Math.max(vb.x, -vb.w * 0.3), full.w - vb.w * 0.7); vb.y = Math.min(Math.max(vb.y, -vb.h * 0.3), full.h - vb.h * 0.7);
}
function zoomAt(f, cx, cy) { const nw = Math.min(Math.max(vb.w / f, full.w / 220), full.w); const k = nw / vb.w; vb.x = cx - (cx - vb.x) * k; vb.y = cy - (cy - vb.y) * k; vb.w = nw; clampVb(); draw(); }
function focusOn(x, y, w) { vb.w = w; vb.h = w * full.h / full.w; vb.x = x - vb.w / 2; vb.y = y - vb.h / 2; clampVb(); draw(); }

function draw() {
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const px = unitPx(), zoom = full.w / vb.w;
  // 駅名は、拡大の度合いに応じた乗降客数以上の駅だけ出す（全体表示ではターミナル駅だけ）。
  // 乗降客数の多い順に置き、すでに置いた駅名と重なるものは出さない
  const minP = zoom < 1.6 ? 1000000 : zoom < 2.5 ? 400000 : zoom < 4 ? 150000 : zoom < 7 ? 50000 : zoom < 12 ? 15000 : 0;
  const placed = [];
  labels.forEach((t, i) => {
    const s = ST[i];
    const forced = zoom >= 3 && (i === state.sel || state.cmp.includes(i));
    let on = (s.p >= minP || forced) && !(state.tab === "point" && zoom > 25);
    if (on) {
      const y = s.y - stR(i, px) - 4 * px, w = s.n.length * 13 * px, h = 15 * px;
      const box = { x0: s.x - w / 2, x1: s.x + w / 2, y0: y - h, y1: y + 2 * px };
      if (!forced && placed.some(b => b.x0 < box.x1 && box.x0 < b.x1 && b.y0 < box.y1 && box.y0 < b.y1)) on = false;
      else { placed.push(box); t.setAttribute("font-size", 13 * px); t.setAttribute("stroke-width", 3.5 * px); t.setAttribute("y", y); }
    }
    t.style.display = on ? "" : "none";
  });
  gWN.querySelectorAll("text").forEach(t => t.setAttribute("font-size", 12 * px));
  gWN.style.display = zoom > 8 ? "none" : "";
  drawRailLabels(px);
  circles.forEach((c, i) => c.setAttribute("r", stR(i, px)));
  // 乗降客数タブで拡大したときは、大きな駅の円を輪郭だけにして、店や地図を隠さない
  gC.classList.toggle("zoomed", state.tab === "pass" && zoom > 10);
  drawPoint();
}

svg.addEventListener("wheel", e => { e.preventDefault(); const p = toMap(e.clientX, e.clientY); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, p.x, p.y); }, { passive: false });
const center = () => ({ x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 });
$("zin").onclick = () => { const c = center(); zoomAt(1.6, c.x, c.y); };
$("zout").onclick = () => { const c = center(); zoomAt(1 / 1.6, c.x, c.y); };
$("zreset").onclick = () => { vb = { ...full }; draw(); };

const ptrs = new Map(); let last = null, pinch = null;
svg.addEventListener("pointerdown", e => {
  svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { last = { x: e.clientX, y: e.clientY, moved: false }; svg.classList.add("drag"); }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
});
svg.addEventListener("pointermove", e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); const m = toMap((a.x + b.x) / 2, (a.y + b.y) / 2); zoomAt(d / pinch.d, m.x, m.y); pinch.d = d; hideTip(); return; }
  if (ptrs.size === 1 && last) {
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) last.moved = true;
    if (last.moved) { const u = unitPx(); vb.x -= dx * u; vb.y -= dy * u; last.x = e.clientX; last.y = e.clientY; clampVb(); draw(); hideTip(); return; }
  }
  hover(e);
});
const endPtr = e => {
  const tapped = last && !last.moved && ptrs.size === 1;
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) { svg.classList.remove("drag"); if (tapped) tap(e); last = null; }
};
svg.addEventListener("pointerup", endPtr); svg.addEventListener("pointercancel", endPtr);
svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideTip(); });

function nearestStation(cx, cy) {
  const p = toMap(cx, cy), px = unitPx(); let best = -1, bd = Infinity;
  ST.forEach((s, i) => { const d = Math.hypot(s.x - p.x, s.y - p.y), reach = Math.max(stR(i, px), 9 * px); if (d <= reach && d / reach < bd) { bd = d / reach; best = i; } });
  return best;
}
function nearestStore(cx, cy) {
  if (!state.point) return -1;
  const p = toMap(cx, cy), px = unitPx(); let best = -1, bd = 9 * px;
  pointHits.forEach(h => { const [x, y] = toXY(SS.la[h.i], SS.lo[h.i]); const d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = h.i; } });
  return best;
}
function hover(e) {
  const si = nearestStore(e.clientX, e.clientY);
  if (si >= 0) { placeTip(`<b>${esc(SS.n[si])}</b><div class="s">${esc(genreLabel(si))}</div>`, e); return; }
  const i = nearestStation(e.clientX, e.clientY);
  if (i < 0) { hideTip(); return; }
  const s = ST[i], r = state.tab === "station" ? ringStats(s) : s.r[String(state.radius)];
  const lab = state.tab === "station" ? r.label : `${state.radius}m圏`;
  let extra = "";
  if (state.tab === "genre" && state.genre >= 0) { const q = r.q[state.genre]; extra = `<div class="s">${esc(MID[state.genre])}: ${r.m[state.genre]}店・平均比 ${q == null ? "—" : q.toFixed(2) + "倍"}</div>`; }
  placeTip(`<b>${esc(s.n)}</b><div class="s">乗降客数 ${fmt(s.p)}人/日・${lab} ${fmt(r.t)}店</div>${extra}`, e);
}
function placeTip(html, e) {

// ---- 地点分析 ----
// 店を 0.005 度ごとの格子に入れておき、近くの格子だけ調べる
const CELL = 0.005, grid = new Map();

function storesNear(la, lo, rad) {

  for (let i = a - na; i <= a + na; i++) for (let j = b - nb; j <= b + nb; j++) for (const s of grid.get(i + ":" + j) || []) {
    const d = distM(la, lo, SS.la[s], SS.lo[s]); if (d <= rad) out.push({ i: s, d });

}

  focusOn(x, y, (state.pRadius * 5.5) / mPerUnit);
  render();
}
function drawPoint() {
  gP.innerHTML = "";
  if (state.tab === "station") {
    // 各駅分析: 選んだ範囲（ドーナツ型）を描く。つながった範囲は1つの輪にまとめる
    const s = ST[state.sel], spans = [];
    RINGS.forEach(([a, b], k) => { if (!state.rings[k]) return; const last = spans[spans.length - 1]; if (last && last[1] === a) last[1] = b; else spans.push([a, b]); });
    const circ = rr => rr > 0 ? `M${s.x - rr},${s.y}a${rr},${rr} 0 1,0 ${2 * rr},0a${rr},${rr} 0 1,0 ${-2 * rr},0Z` : "";
    spans.forEach(([a, b]) => el("path", { d: circ(b / mPerUnit) + circ(a / mPerUnit), class: "ring", "fill-rule": "evenodd" }, gP));
    pointHits = []; return;
  }
  if (state.tab !== "point" || !state.point) { pointHits = []; return; }
  const { la, lo } = state.point, [x, y] = toXY(la, lo), px = unitPx();
  el("circle", { cx: x, cy: y, r: state.pRadius / mPerUnit, class: "ring" }, gP);
  pointHits = storesNear(la, lo, state.pRadius * 1.8);
  for (const h of pointHits) {
    if (state.pFilter >= 0 && SS.M[h.i] !== state.pFilter) continue;
    const [sx, sy] = toXY(SS.la[h.i], SS.lo[h.i]);
    el("circle", { cx: sx, cy: sy, r: (h.d <= state.pRadius ? 5 : 3.5) * px, class: "dot", "data-s": h.i, fill: GCOL[SS.M[h.i]], "fill-opacity": h.d <= state.pRadius ? 1 : 0.35 }, gP);
  }

}
// 住所 → 緯度経度（国土交通省 位置参照情報の街区レベル。街区が見つからなければ丁目、町の中心）
const KJ = { "〇": 0, "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };
function kanjiNum(t) { if (t.includes("十")) { const [a, b] = t.split("十"); return (a ? KJ[a] : 1) * 10 + (b ? KJ[b] : 0); } return KJ[t] ?? 0; }
function geocode(v) {
  if (!D.addr || !Object.keys(D.addr).length) return null;
  let t = v.normalize("NFKC").replace(/\s/g, "").replace(/^東京都/, "")
    .replace(/(\d)[ー‐－―−–—](?=\d)/g, "$1-").replace(/([〇一二三四五六七八九十]+)(?=丁目|番|号)/g, m => kanjiNum(m));
  const wards = Object.keys(D.addr);
  const w0 = wards.find(w => t.startsWith(w));
  let best = null;
  for (const w of (w0 ? [w0] : wards)) {
    const rest = w0 ? t.slice(w.length) : t;
    for (const town of Object.keys(D.addr[w])) {
      if (rest.startsWith(town) && (!best || town.length > best.town.length)) best = { w, town, rest: rest.slice(town.length) };
    }
  }
  if (!best) return null;
  const chomes = D.addr[best.w][best.town];
  const hasChome = Object.keys(chomes).some(k => k !== "0");
  const nums = (best.rest.replace(/^大字/, "").match(/\d+/g) || []).map(Number);
  const dec = e => [e[0] / 1e5 + 35, e[1] / 1e5 + 139];

  let entry = chomes[c];
  if (!entry) {
    // 丁目が分からない・存在しない: 町に含まれる丁目の中心の平均
    const es = Object.values(chomes);
    const la = es.reduce((a, e) => a + e[0], 0) / es.length, lo = es.reduce((a, e) => a + e[1], 0) / es.length;
    return { la: la / 1e5 + 35, lo: lo / 1e5 + 139, label, prec };

  if (hasChome) { label += `${c}丁目`; prec = "丁目の中心"; }

    const v = $("q4").value.trim(); if (!v) return;
    if (mode === "coords") { const c = parseCoords(v); return c ? setPoint(c[0], c[1], "指定した地点") : fail("「35.6974, 139.8266」の形で、23区内の座標を入れてください"); }
    const g = geocode(v); return g ? setPoint(g.la, g.lo, `${g.label}（${g.prec}）`) : fail("住所が見つかりません。「区＋町名＋丁目＋番」の形で入れてください（23区内）");
  };
  pointGo = go;
  $("q4-go").onclick = go; $("q4").addEventListener("keydown", e => { $("q4").setCustomValidity(""); if (e.key === "Enter") go(); });
  if (p) {
    bindSeg("segP", v => { state.pRadius = v; const [x, y] = toXY(p.la, p.lo); focusOn(x, y, (v * 5.5) / mPerUnit); render(); });
    $("p-point").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { state.pFilter = +b.dataset.f; render(); draw(); });
    bindRowTip($("ptList"));
    $("aiCopy").onclick = () => copyText(aiPrompt(p, storesNear(p.la, p.lo, state.pRadius).filter(h => state.pFilter < 0 || SS.M[h.i] === state.pFilter)), $("aiCopyMsg"));
  }
}

// ---- AI で調べる用のコピー（営業時間・価格帯・評価はこのサイトでは取らず、ユーザーが自分の AI チャットで調べる） ----
const AI_MAX = 50;
function aiPrompt(p, hits) {
  const list = hits.slice(0, AI_MAX);
  const scope = state.pFilter >= 0 ? `のうち${M[state.pFilter]}の店` : "";
  return [
    `以下は「${p.label}」（緯度・経度 ${p.la.toFixed(6)}, ${p.lo.toFixed(6)}）から半径${state.pRadius}m以内の飲食店${scope}の一覧です（近い順に${list.length}店${hits.length > list.length ? `。全${hits.length}店のうち近い${list.length}店` : ""}）。`,
    "各店について Web で調べ、次の項目を表にまとめてください。",
    "- 営業時間と定休日",
    "- 価格帯（昼・夜それぞれの目安）",
    "- Google マップの評価（★）と口コミの数",
    "- 公式サイトまたは Google マップの URL",
    "調べても分からない項目は「不明」とし、推測で埋めないでください。閉店している店は、その旨を書いてください。",
    "同じ名前の別の店と取り違えないよう、位置（緯度・経度）が一覧と合っているか確かめてください。",
    "",
    ["No", "店名", "ジャンル", "指定地点からの距離", "緯度, 経度"].join("\t"),
    ...list.map((h, k) => [k + 1, SS.n[h.i], genreLabel(h.i), `${Math.round(h.d)}m`, `${SS.la[h.i].toFixed(5)}, ${SS.lo[h.i].toFixed(5)}`].join("\t")),
  ].join("\n");
}
// クリップボードにコピーする。ブラウザが許さないときは、選択した状態の文章を出して手でコピーしてもらう
async function copyText(text, msgEl) {
  const done = () => { msgEl.textContent = "コピーしました。お使いの AI チャットに貼り付けてください。AI の調べた結果には誤りや古い情報が含まれることがあるので、必ず確かめてください。"; };
  try { await navigator.clipboard.writeText(text); done(); return; } catch (e) { /* 下の方法を試す */ }
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  if (ok) { done(); return; }
  openModal("AIで調べる用の文章", `<p class="muted-t">自動でコピーできなかったので、下の文章をすべて選んでコピーしてください。</p><textarea class="copybox" readonly>${esc(text)}</textarea>`);
  const box = document.querySelector("#mBody .copybox"); box.focus(); box.select();
}

// 近隣店の一覧: 行に触れると、店名・ジャンル・距離の全文をポップアップで出し、地図の点を強調する（スマホは行を押す）
const rowTip = $("rowtip");
function bindRowTip(list) {
  if (!list) return;
  const show = (row, x, y) => {
    const i = +row.dataset.s;
    rowTip.innerHTML = `<b>${esc(SS.n[i])}</b><div class="s">${esc(genreLabel(i))}</div><div class="s">指定地点から ${row.dataset.d}m</div>`;
    rowTip.hidden = false;
    const w = rowTip.offsetWidth, h = rowTip.offsetHeight;
    rowTip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 14)) + "px";
    rowTip.style.top = (y + 16 + h > window.innerHeight - 8 ? y - h - 12 : y + 16) + "px";
    gP.querySelectorAll(".dot.hot").forEach(d => d.classList.remove("hot"));
    const dot = gP.querySelector(`.dot[data-s="${i}"]`); if (dot) dot.classList.add("hot");
  };
  const hide = () => { rowTip.hidden = true; gP.querySelectorAll(".dot.hot").forEach(d => d.classList.remove("hot")); };
  list.addEventListener("mousemove", e => { const row = e.target.closest(".srow"); if (row) show(row, e.clientX, e.clientY); else hide(); });
  list.addEventListener("mouseleave", hide);
  list.addEventListener("click", e => { const row = e.target.closest(".srow"); if (row) { const r = row.getBoundingClientRect(); show(row, r.left + 20, r.bottom - 4); } });
  list.addEventListener("scroll", hide, { passive: true });
}
window.addEventListener("scroll", () => { rowTip.hidden = true; }, { passive: true });
document.addEventListener("click", e => { if (!rowTip.hidden && !(e.target.closest && e.target.closest("#ptList"))) rowTip.hidden = true; });

// ---- 乗降客数（乗降客数の順位と路線） ----
const gRL = $("gRL");
function selectLine(n) {
  state.line = state.line === n ? null : n;
  gR.classList.toggle("dim", !!state.line);
  railEls.forEach((p, i) => p.classList.toggle("sel", D.rails[i].n === state.line));
  if (state.line) {
    const i = D.rails.findIndex(r => r.n === state.line);
    const k = D.rails[i].k, box = $({ jr: "lyJr", private: "lyPrivate", subway: "lySub" }[k]);
    if (!box.checked) { box.checked = true; box.dispatchEvent(new Event("change")); }
    railEls[i].parentNode.appendChild(railEls[i]);
    const bb = railEls[i].getBBox();
    vb.w = Math.max(bb.width, bb.height * full.w / full.h) * 1.16; vb.h = vb.w * full.h / full.w;
    vb.x = bb.x + bb.width / 2 - vb.w / 2; vb.y = bb.y + bb.height / 2 - vb.h / 2; clampVb();
  }
  render(); draw();
}
function drawRailLabels(px) {
  // 路線名の札は、乗降客数タブで路線を選んだときだけ、駅の円となるべく重ならない位置に出す
  gRL.innerHTML = "";
  if (state.tab !== "pass" || !state.line) return;
  const r = D.rails.find(x => x.n === state.line); if (!r) return;
  const fs = 15 * px, h = 24 * px, w = r.n.length * fs + 16 * px;
  const hit = (a, b) => a.x0 < b.x1 && b.x0 < a.x1 && a.y0 < b.y1 && b.y0 < a.y1;
  const cand = r.a.filter(([x, y]) => x > vb.x && x < vb.x + vb.w && y > vb.y && y < vb.y + vb.h).map(([x, y]) => {
    const box = { x0: x - w / 2, x1: x + w / 2, y0: y - h / 2, y1: y + h / 2 };
    let cover = 0; ST.forEach(st => { const rr = R(st.p); if (hit(box, { x0: st.x - rr, x1: st.x + rr, y0: st.y - rr, y1: st.y + rr })) cover += rr * rr; });
    return { x, y, box, cover };
  }).sort((a, b) => a.cover - b.cover);
  const placed = [];
  for (const c of cand) {
    if (placed.some(p => hit(p.box, c.box) || Math.hypot(p.x - c.x, p.y - c.y) < 260 * px)) continue;
    placed.push(c);
    const g = el("g", { class: `rail-lbl ${r.k}` }, gRL);
    el("rect", { x: c.box.x0, y: c.box.y0, width: w, height: h, rx: h / 2 }, g);
    el("text", { x: c.x, y: c.y, "font-size": fs }, g).textContent = r.n;
  }
}
function renderPass() {
  const n = state.passAll ? ST.length : 30;
  const pick = state.passPick;
  const lines = [["jr", "JR"], ["private", "私鉄"], ["subway", "地下鉄"]].map(([k, label]) =>
    `<div class="lgrp"><span>${label}</span>${D.rails.filter(r => r.k === k).map(r => r.n).sort((a, b) => a.localeCompare(b, "ja")).map(x => `<button class="lchip ${k}" type="button" data-line="${esc(x)}" aria-pressed="${x === state.line}">${esc(x)}</button>`).join("")}</div>`).join("");
  $("p-pass").innerHTML = `<p class="lead">駅の利用者数の順位を調べます。</p>
    ${pick != null ? `<div class="summary"><span class="tag">選んだ駅</span><p><b>${esc(ST[pick].n)}</b>　${fmt(ST[pick].p)}人/日（${pick + 1}位）　${esc(ST[pick].o)}</p></div>` : ""}
    <div><h3>乗降客数の多い駅（1日平均）</h3>
      <div>${ST.slice(0, n).map((s, i) => `<div class="prow" tabindex="0" role="button" data-i="${i}"><span class="r">${i + 1}</span><span class="n">${esc(s.n)}</span><span><div class="pb" style="width:${(s.p / maxP * 100).toFixed(2)}%"></div></span><span class="v">${fmt(s.p)}</span></div>`).join("")}</div>
      <div class="actions" style="margin-top:8px"><button class="btn" id="passAll" type="button">${state.passAll ? "上位30駅だけ表示" : `全${ST.length}駅を表示`}</button></div></div>
    <div class="lines ${state.line ? "dim" : ""}" style="display:grid;gap:10px"><h3>路線（押すと地図で強調）</h3>${lines}</div>
    <p class="muted-t">乗換駅は事業者の合計。同じ駅名で500m以内の駅はまとめています。乗降客数が公表されていない駅は除いています。</p>`;
  $("passAll").onclick = () => { state.passAll = !state.passAll; render(); };
  $("p-pass").querySelectorAll(".prow").forEach(r => { const go = () => { const i = +r.dataset.i; state.passPick = i; paintStations(); focusOn(ST[i].x, ST[i].y, full.w / 6); render(); }; r.onclick = go; r.onkeydown = e => { if (e.key === "Enter") go(); }; });
  $("p-pass").querySelectorAll("[data-line]").forEach(b => b.onclick = () => selectLine(b.dataset.line));
}

function render() {
  if (state.tab === "station") renderStation();
  if (state.tab === "compare") renderCompare();
  if (state.tab === "genre") renderGenre();
  if (state.tab === "point") renderPoint();
  if (state.tab === "pass") renderPass();
}

// 比較の初期表示: 渋谷と成城学園前
state.cmp = ["渋谷", "成城学園前"].map(stByName).filter(i => i != null);
showTab("point");
window.addEventListener("resize", draw);
</script>
